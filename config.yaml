# code CN Bridge 默认配置文件
# 详细配置请通过桌面应用或 CLI 管理

server:
  host: 127.0.0.1
  port: 8765
  auto_start: true
  close_to_tray: true
  log_level: info
  audit_log_path: ""

providers:
  deepseek:
    adapter: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  doubao:
    adapter: doubao
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  kimi:
    adapter: kimi
    base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  qwen:
    adapter: qwen
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  zhipu:
    adapter: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  agnes:
    adapter: agnes
    base_url: https://apihub.agnes-ai.com/v1
    api_key_env: AGNES_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  minimax:
    adapter: minimax
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  hunyuan:
    adapter: hunyuan
    base_url: https://api.hunyuan.cloud.tencent.com/v1
    api_key_env: HUNYUAN_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  ernie:
    adapter: ernie
    base_url: https://qianfan.baidubce.com/v2
    api_key_env: ERNIE_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  spark:
    adapter: spark
    base_url: https://spark-api-open.xf-yun.com/v1
    api_key_env: SPARK_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  siliconflow:
    adapter: siliconflow
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true
  ollama:
    adapter: ollama
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    enabled: false
    extra_headers: {}
    max_retries: 0
    timeout: 120
    tool_calls_enabled: true

