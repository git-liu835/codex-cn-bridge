name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      # ── Linux 系统依赖 ──────────────────────────────────────────
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libfuse2 dpkg-dev fakeroot

      # ── Python 后端 ─────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Python backend (PyInstaller)
        run: python scripts/build-backend.py

      # ── Electron 前端 ────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Electron frontend
        run: |
          cd desktop
          npm install
          npm run build

      # ── 打包 ────────────────────────────────────────────────────
      - name: Package (electron-builder)
        env:
          GH_TOKEN: ''
        run: |
          cd desktop
          npx electron-builder --config electron-builder.yml --publish never 2>&1
          # 重命名 latest.yml 避免多平台覆盖
          if [ -f release/latest.yml ]; then
            mv release/latest.yml "release/latest-${{ matrix.artifact }}.yml"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/*.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts/

      # 合并各平台的 latest-*.yml 为统一的 latest.yml，并重新计算 SHA512
      - name: Merge platform latest.yml
        run: |
          python3 -c "
          import os, hashlib, base64
          from datetime import datetime, timezone

          artifacts = 'artifacts'
          ymls = sorted(f for f in os.listdir(artifacts) if f.startswith('latest-') and f.endswith('.yml'))

          # 从各平台 yml 提取 url 列表（保持原始排序）
          file_urls = []  # list of (url, source_yml)
          version = ''
          for yml in ymls:
              with open(os.path.join(artifacts, yml), 'r') as fh:
                  content = fh.read()
              if not version:
                  import re
                  m = re.search(r'^version:\s*(.+)', content, re.M)
                  if m: version = m.group(1).strip()
              # 提取 files 数组中的 url
              for line in content.split('\n'):
                  m = re.match(r'\s+- url:\s*(\S+)', line)
                  if m:
                      url = m.group(1).strip()
                      if not any(u == url for u, _ in file_urls):
                          file_urls.append((url, yml))

          # 直接计算每个安装包文件的 SHA512（不依赖 yml 里的旧 hash）
          file_entries = []
          primary_sha = ''
          primary_path = ''
          for url, src_yml in file_urls:
              filepath = os.path.join(artifacts, url)
              if not os.path.exists(filepath):
                  print(f'WARNING: {url} not found in artifacts, skipping')
                  continue
              size = os.path.getsize(filepath)
              sha = hashlib.sha512()
              with open(filepath, 'rb') as fh:
                  while True:
                      chunk = fh.read(8192)
                      if not chunk: break
                      sha.update(chunk)
              sha_b64 = base64.b64encode(sha.digest()).decode('ascii')
              file_entries.append(f'  - url: {url}\n    sha512: {sha_b64}\n    size: {size}')
              print(f'{url}: size={size} sha512={sha_b64}')
              # Windows exe 作为主 path
              if url.endswith('.exe'):
                  primary_path = url
                  primary_sha = sha_b64

          if not primary_path and file_urls:
              primary_path = file_urls[0][0]

          # 写入 latest.yml
          with open(os.path.join(artifacts, 'latest.yml'), 'w') as fh:
              fh.write(f'version: {version}\n')
              fh.write('files:\n')
              for entry in file_entries:
                  fh.write(entry + '\n')
              if primary_path:
                  fh.write(f'path: {primary_path}\n')
                  fh.write(f'sha512: {primary_sha}\n')
              fh.write(f'releaseDate: {datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%S.000Z\")}\n')

          # 删除各平台独立 yml
          for yml in ymls:
              os.remove(os.path.join(artifacts, yml))

          print('Combined latest.yml generated')
          with open(os.path.join(artifacts, 'latest.yml'), 'r') as fh:
              print(fh.read())
          "
        shell: bash

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body_path: CHANGELOG.md
